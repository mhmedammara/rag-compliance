# =====================================================================
#  Pile locale : n8n + Postgres/pgvector + serveur de fichiers
#  Remplace Supabase (base + Storage). Voir GUIDE-DEPLOIEMENT.md.
#
#    cd compliance-rag/docker
#    copy .env.example .env      (puis choisir un mot de passe)
#    docker compose up -d
#
#  n8n            http://localhost:5678
#  Postgres       127.0.0.1:5433 (scripts Python)  /  postgres:5432 (depuis n8n)
#                 Pas "localhost" cote scripts : sous Windows, libpq essaie
#                 d'abord ::1 et bloque ~2 min avant de se rabattre sur IPv4.
#  Fichiers       http://localhost:8088/documents-preuve/{code_doc}.pdf
#                 http://localhost:8088/generes/{classeur}.xlsx
#
#  Ressources : chaque service est plafonne en memoire (mem_limit) et en CPU
#  (cpus) avec une marge au-dessus de sa consommation reelle ; les tailles de
#  tas Node / buffers Postgres sont reglees en dessous de ces plafonds pour ne
#  jamais etre tues par le noyau (OOM). Mesure au repos (hors cache disque) :
#  n8n ~160 Mo (~370 Mo juste apres demarrage), postgres ~45 Mo, fichiers ~3 Mo.
#  Les executions actuelles du workflow pesent < 1 Mo : c'est le socle de n8n
#  (noeuds, modules LangChain) qui domine, pas les donnees traitees.
# =====================================================================

name: logiclever-conformite

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      # Local uniquement : en production, Caddy (docker-compose.prod.yml)
      # est la seule porte d'entree publique, en HTTPS.
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      # Le noeud "Televerser le classeur" ecrit dans /files/generes.
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      # Tas V8 plafonne : processus principal et runner des noeuds Code.
      NODE_OPTIONS: --max-old-space-size=384
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: "128"
      # Telemetrie et verification de version : taches de fond inutiles ici.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    # 384 + 128 Mo de tas + ~200 Mo hors tas (code, buffers) < 768 Mo.
    # CPU : les 3 services se partagent 1 fil du processeur (0,6 + 0,3 + 0,1).
    # Le workflow attend surtout l'API LLM ; seul le demarrage est plus lent.
    cpus: 0.6
    mem_limit: 768m
    volumes:
      # Volume existant du conteneur "docker run" d'origine : workflows,
      # credentials et cle de chiffrement sont conserves.
      - n8n_data:/home/node/.n8n
      - ./stockage:/files
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logiclever}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-logiclever}
    # Base de ~30 Mo dont ~8 Mo d'index HNSW : 16 Mo de buffers gardent les
    # index chauds, le cache disque du noyau sert le reste. n8n n'ouvre qu'une
    # connexion ; 10 laissent la place aux scripts Python. Les index HNSW
    # (7 Mo au plus) se construisent entierement dans 16 Mo.
    command: >
      postgres
      -c shared_buffers=16MB
      -c max_connections=10
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_parallel_workers_per_gather=0
    # Sans requete parallele, une requete n'utilise qu'un coeur ; sur une base
    # de cette taille elle dure quelques ms.
    cpus: 0.3
    mem_limit: 128m
    ports:
      # 5433 cote hote pour ne pas entrer en conflit avec un Postgres local.
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  fichiers:
    image: nginx:alpine
    restart: unless-stopped
    # Sans plafond CPU, nginx lance un worker par coeur (18 ici) : 1 suffit.
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    cpus: 0.1
    mem_limit: 16m
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./stockage:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  n8n_data:
    external: true
  pg_data:
