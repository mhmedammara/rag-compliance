# Serveur de fichiers "fichiers" : PDF de preuve et classeurs generes, avec
# liste des dossiers pour parcourir docker/stockage depuis le navigateur.
server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
